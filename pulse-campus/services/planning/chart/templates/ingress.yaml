{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "planning.fullname" . }}
  labels:
    {{- include "planning.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.useDeployment }}{{ include "planning.fullname" . }}{{ else if eq .Values.strategyType "blueGreen" }}{{ include "planning.fullname" . }}-active{{ else }}{{ include "planning.fullname" . }}-stable{{ end }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
