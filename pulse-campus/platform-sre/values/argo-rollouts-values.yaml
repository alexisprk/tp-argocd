# Values du chart argo-rollouts.
# Référence : https://github.com/argoproj/argo-helm/tree/main/charts/argo-rollouts
#
# Étape 5 du poly.

# Active le dashboard Web et l'expose via ingress sur rollouts.devhub.local.
dashboard:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - rollouts.devhub.local
    paths:
      - /
    pathType: Prefix

# Active le service de notifications utilisé en étape 10.
notifications:
  notifiers:
    service.webhook.notif: |
      url: http://notif-dev-notif.devhub-dev.svc.cluster.local:8080/events
      headers:
        - name: Content-Type
          value: application/json
  templates:
    template.rollout-completed: |
      webhook:
        notif:
          method: POST
          body: |
            {
              "type": "info",
              "message": "Rollout {{ .rollout.metadata.name }} has completed successfully."
            }
    template.rollout-aborted: |
      webhook:
        notif:
          method: POST
          body: |
            {
              "type": "error",
              "message": "Rollout {{ .rollout.metadata.name }} has aborted and rolled back."
            }
  triggers:
    trigger.on-rollout-completed: |
      - when: rollout.status.phase == 'Healthy'
        send: [rollout-completed]
    trigger.on-rollout-aborted: |
      - when: rollout.status.phase == 'Degraded'
        send: [rollout-aborted]
  secret:
    create: true
  configmap:
    create: true

# En kind, gardez les ressources légères.
controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
