# Application ArgoCD : planning-dev
#
# Variante de annuaire.yaml pour le service planning.
# Une fois annuaire fait, dupliquez et adaptez — pas de mystère.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planning-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devhub
  source:
    repoURL: https://github.com/alexisprk/tp-argocd.git
    targetRevision: main
    path: services/planning/chart
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devhub-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
